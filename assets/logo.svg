<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Avionics Gold-to-Cyan Gradient -->
    <linearGradient id="stac-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Satellite Orbit Gradient -->
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />
  <rect width="796" height="796" x="2" y="2" rx="158" fill="none" stroke="#1E293B" stroke-width="2" />

  <!-- Orbital Navigation & Flight Reticle -->
  <g opacity="0.16" stroke="#00D2FF" stroke-width="1.5">
    <ellipse cx="400" cy="380" rx="240" ry="140" fill="none" stroke-dasharray="8 8" />
    <circle cx="400" cy="380" r="140" fill="none" stroke-dasharray="6 6" />
    <line x1="400" y1="100" x2="400" y2="660" stroke-dasharray="4 8" />
    <line x1="120" y1="380" x2="680" y2="380" stroke-dasharray="4 8" />
  </g>

  <!-- Elliptical Orbital Vector -->
  <ellipse cx="400" cy="380" rx="260" ry="110" transform="rotate(-30, 400, 380)" fill="none" stroke="url(#orbit-grad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.7" />

  <!-- Central Avionics & Software Diamond Crest -->
  <polygon points="400,190 560,380 400,570 240,380" fill="url(#core-glow)" stroke="url(#stac-grad)" stroke-width="8" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Inner Circuit & Code Elements -->
  <!-- Left Side: Code Brackets / Software Track -->
  <g stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#subtle-glow)">
    <polyline points="340,330 300,380 340,430" />
    <!-- Forward Slash / System Boundary -->
    <line x1="385" y1="440" x2="415" y2="320" stroke="#F59E0B" stroke-width="5" />
    <!-- Right Side: Hardware Actuator / Sensor Symbol -->
    <polyline points="460,330 500,380 460,430" />
  </g>

  <!-- Central Avionics Microcontroller Pulse Core -->
  <circle cx="400" cy="380" r="18" fill="#111827" stroke="#10B981" stroke-width="4" filter="url(#subtle-glow)" />
  <circle cx="400" cy="380" r="6" fill="#F8FAFC" />

  <!-- Orbital Satellite / Telemetry Sensor Beacon -->
  <g filter="url(#subtle-glow)">
    <circle cx="580" cy="270" r="12" fill="#F59E0B" />
    <!-- Satellite Solar Panels -->
    <rect x="560" y="266" width="8" height="8" fill="#38BDF8" />
    <rect x="592" y="266" width="8" height="8" fill="#38BDF8" />
  </g>

  <!-- Typography -->
  <text x="400" y="685" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="4">
    STAC<tspan fill="#F59E0B">TASKS</tspan>
  </text>
  <text x="400" y="722" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="3">
    SOFTWARE &amp; AVIONICS SYSTEMS PORTFOLIO
  </text>
</svg>
